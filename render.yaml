# Render.com 블루프린트 — 상태 없는 OMR API 서비스(mock-report-web 연동용).
# New + → Blueprint → 이 저장소 선택.
services:
  - type: web
    name: omr-api
    runtime: docker
    plan: starter          # 항상 켜짐(약 $7/월). stateless라 영구 디스크 불필요.
    healthCheckPath: /health
    envVars:
      - key: APP_MODULE
        value: omr_api.main:app
      - key: OMR_API_KEY      # Next 앱과 공유할 비밀 키 — 배포 시 직접 입력
        sync: false
      - key: ALLOWED_ORIGINS  # 허용할 프론트 도메인(쉼표), 예: https://우리앱.vercel.app
        sync: false
